[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-recommend"
version = "0.1.0"
description = "SmartRecommend - Hybrid E-Commerce Recommendation Engine (Retailrocket)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SmartRecommend ML Engineering Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "implicit>=0.7.2",
    "lightgbm>=4.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "mlflow>=2.12.0",
    "joblib>=1.3.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
